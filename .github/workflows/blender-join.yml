# Joins rendered frames from one or more "Blender render" runs into a single MP4
# (used when some chunks had to be re-rendered in a separate run).
name: Blender join

on:
  workflow_dispatch:
    inputs:
      scene:
        description: "Scene name (output file name)"
        required: true
        default: "knight_forest"
      runs:
        description: "Run IDs to collect frames-* artifacts from (space separated; later runs win)"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  join:
    runs-on: ubuntu-24.04
    steps:
      - name: Collect frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frames
          for R in ${{ inputs.runs }}; do
            rm -rf dl && mkdir dl
            gh run download "$R" -R "${{ github.repository }}" -p 'frames-*' -D dl
            find dl -name '*.png' -exec cp -f {} frames/ \;
          done
          ls frames | wc -l
          ls frames | head -1; ls frames | tail -1
      - name: Encode MP4
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          START=$(ls frames | head -1 | sed 's/\.png//')
          ffmpeg -y -loglevel error -framerate 24 -start_number "$((10#$START))" -i frames/%04d.png \
            -vf "noise=alls=6:allf=t,vignette=PI/5.5,format=yuv420p" -c:v libx264 -crf 16 -preset slow -movflags +faststart \
            "${{ inputs.scene }}.mp4"
          ffprobe -v error -show_entries format=duration:stream=width,height,nb_frames -of compact "${{ inputs.scene }}.mp4"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.scene }}-video
          path: ${{ inputs.scene }}.mp4
          retention-days: 14
