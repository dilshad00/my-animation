# Free cloud render on GitHub Actions.
# Splits the video into N chunks, renders them in parallel on separate runners
# (muted H.264 + WAV audio per chunk), then joins them losslessly into one MP4.
#
# Run it: GitHub → Actions → "Render video" → Run workflow → project id (e.g. video-001).
# Download: the run's "Artifacts" section → <project>-final.
#
# Cost: free and unlimited on PUBLIC repos. On private repos it uses your free monthly
# Actions minutes (≈ chunks × 20–40 min per render).
name: Render video

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project id (folder in projects/) or a standalone composition id (e.g. Anime-Demo)"
        required: true
        default: "video-001"
      chunks:
        description: "Parallel chunks (1–20)"
        required: true
        default: "8"
      seconds:
        description: "Only render the first N seconds (0 = whole video) – for test runs"
        required: true
        default: "0"
      draft:
        description: "Half-resolution draft instead of final 1080p"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PROJECT: ${{ inputs.project }}
