  SCALE_ARGS: ${{ inputs.draft && '--scale=0.5 --crf=28' || '--crf=18' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate (skipped for standalone compositions such as Anime-Demo)
        run: if [ -d "projects/$PROJECT" ]; then npm run validate -- "$PROJECT"; else npm run sync; fi
      - id: plan
        run: echo "matrix=$(npx tsx scripts/cloud-plan.ts "$PROJECT" "${{ inputs.chunks }}" "${{ inputs.seconds }}")" >> "$GITHUB_OUTPUT"

  chunk:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.matrix).chunks }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx remotion browser ensure
      - run: npm run sync
      - name: Render audio (WAV)
        run: npx remotion render "$PROJECT" out/audio${{ matrix.chunk.i }}.wav --codec=wav --frames=${{ matrix.chunk.range }} --log=info
      - name: Render video (muted H.264)
        run: npx remotion render "$PROJECT" out/part${{ matrix.chunk.i }}.mp4 --codec=h264 $SCALE_ARGS --muted --frames=${{ matrix.chunk.range }} --log=info
      - uses: actions/upload-artifact@v6
        with:
          name: chunk-${{ matrix.chunk.i }}
          path: out/
          retention-days: 2

  join:
    needs: [plan, chunk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v7
        with: { path: parts, pattern: chunk-*, merge-multiple: true }
      - name: Join chunks
        run: |
          N=$(echo '${{ needs.plan.outputs.matrix }}' | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).chunks.length))")
          cd parts
          : > list.txt; : > alist.txt
          for i in $(seq 0 $((N-1))); do echo "file 'part$i.mp4'" >> list.txt; echo "file 'audio$i.wav'" >> alist.txt; done
          npx remotion ffmpeg -y -loglevel error -f concat -safe 0 -i alist.txt -c:a pcm_s16le audio.wav
          npx remotion ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -i audio.wav -map 0:v -map 1:a \
            -c:v copy -c:a aac -b:a 320k -movflags +faststart "../$PROJECT.mp4"
          cd ..
          npx remotion ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of compact "$PROJECT.mp4"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.project }}-final
          path: ${{ inputs.project }}.mp4
          retention-days: 14
